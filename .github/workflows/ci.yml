name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # Fast feedback first: static gates and unit tests, no browser needed.
  static:
    name: lint · typecheck · unit · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No explicit version: the action reads `packageManager` from
      # package.json (pnpm@9.15.9), which is the single source of truth.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run gates
        run: pnpm verify

      - name: Upload gate logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: test-results/logs
          retention-days: 7

  # Visual + interaction suite. Runs separately so a slow browser job cannot
  # block the signal from the static gates.
  visual:
    name: visual (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No explicit version: the action reads `packageManager` from
      # package.json (pnpm@9.15.9), which is the single source of truth.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # The runner renders with SwiftShader (no GPU), so the per-test budget is
      # generous on purpose. FPS assertions stay behind PERF_FPS_ASSERT.
      - name: Run visual suite
        run: pnpm run test:visual -- --timeout=300000

      - name: Upload visual artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-artifacts
          path: |
            playwright-report
            test-results
          retention-days: 7
